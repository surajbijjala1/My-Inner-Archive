<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="My Inner Archive — A private AI-powered journaling space to capture thoughts, track mood, and reflect on your own wisdom." />
  <meta name="theme-color" content="#f2efe9" />
  <!-- Theme before first paint (no flash of the wrong colours). Mirrors
       applyTheme(readStoredTheme()) in src/theme.ts: key "arc_theme", values
       system | light | dark; anything unreadable falls back to system. -->
  <script>
    (function () {
      var pref = "system";
      try {
        var stored = window.localStorage.getItem("arc_theme");
        if (stored === "light" || stored === "dark" || stored === "system") pref = stored;
      } catch (e) {}
      var dark = pref === "dark";
      if (pref === "system") {
        try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
      }
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      if (dark) {
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", "#1e1813");
      }
    })();
  </script>
  <link rel="manifest" href="/manifest.json" />
  <title>My Inner Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Caveat:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
